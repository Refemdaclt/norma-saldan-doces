<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Norma Saldan Doces Finos (prévia)</title>
<style>
  :root { --fundo: #f8f1e7; --texto: #4a2c22; --suave: #8a6a5a; }
  html, body { margin: 0; height: 100%; background: var(--fundo); color: var(--texto);
    font-family: Georgia, "Times New Roman", serif; }
  #aviso { position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center;
    justify-content: center; gap: 12px; padding: 24px; text-align: center; }
  #aviso h1 { font-weight: normal; font-size: 28px; margin: 0; }
  #aviso p { margin: 0; color: var(--suave); font-family: system-ui, sans-serif; font-size: 15px; max-width: 420px; line-height: 1.5; }
  .bolinha { width: 36px; height: 36px; border-radius: 50%; border: 3px solid #e6d3bd;
    border-top-color: var(--texto); animation: gira 1s linear infinite; }
  @keyframes gira { to { transform: rotate(360deg); } }
  iframe { position: fixed; inset: 0; width: 100%; height: 100%; border: 0; background: transparent; }
</style>
</head>
<body>
<div id="aviso">
  <div class="bolinha"></div>
  <h1>Norma Saldan Doces Finos</h1>
  <p>Carregando a prévia do site. Na primeira vez pode levar cerca de 1 minuto.</p>
</div>
<iframe id="site" title="Prévia do site Norma Saldan Doces Finos" allow="clipboard-write"></iframe>
<script>
  // ?t= evita que o navegador use um blueprint antigo guardado em cache.
  var blueprint = new URL('blueprint.json?t=' + Date.now(), location.href).href;
  document.getElementById('site').src =
    'https://playground.wordpress.net/?mode=seamless&login=no&blueprint-url=' + encodeURIComponent(blueprint);
</script>
</body>
</html>
